<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FadeMoe4 Dashboard</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header style="display: flex; align-items: center; justify-content: flex-start; gap: 10px;">
  <img src="Logo13b.png" alt="Logo" style="height:130px;" />
  <h1 style="margin: 0 200px 0 0;">FadeMoe</h1>
  <div id="system-status-box" class="status-box-container"></div>
</header>

<main>
  <!-- View Toggle Buttons -->
  <section class="controls">
    <button id="view-db-btn" class="btn btn-normal btn-active glow-blue">View DB</button>
    <button id="view-alerts-btn" class="btn btn-normal">Alert Cards</button>
    <button id="view-backtester-btn" class="btn btn-normal">Backtester</button>
  </section>

  <!-- Container for loading views -->
  <section id="view-container" class="content-section" style="margin-top:20px;">
    <!-- Content will be loaded here dynamically -->
  </section>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const viewContainer = document.getElementById('view-container');
    const btnDb = document.getElementById('view-db-btn');
    const btnAlerts = document.getElementById('view-alerts-btn');
    const btnBacktester = document.getElementById('view-backtester-btn');

    function clearActive() {
      [btnDb, btnAlerts, btnBacktester].forEach(btn => {
        btn.classList.remove('btn-active', 'glow-blue');
      });
    }

    async function loadView(url, scripts = [], initFuncs = []) {
  const response = await fetch(url);
  if (!response.ok) {
    viewContainer.innerHTML = `<div class="error-message">Failed to load view: ${url}</div>`;
    return;
  }
  const html = await response.text();
  const bodyMatch = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  if (bodyMatch) {
    viewContainer.innerHTML = bodyMatch[1];
  } else {
    viewContainer.innerHTML = html;
  }

  // Remove previously added scripts to avoid duplicates
  document.querySelectorAll('script.dynamic-script').forEach(s => s.remove());

  // Load scripts dynamically and mark them so we can remove later
  for (const src of scripts) {
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.classList.add('dynamic-script');
      script.onload = resolve;
      script.onerror = reject;
      document.body.appendChild(script);
    });
  }

      // Call initialization functions if present
      for (const funcName of initFuncs) {
        if (typeof window[funcName] === 'function') {
          window[funcName]();
        }
      }
    }
    // Initial load: DB view
    loadView('dbview.html', ['js/uifunctions.js', 'js/controls.js', 'js/main.js'], ['initializeUI', 'initializeControls']);
      btnDb.classList.add('btn-active', 'glow-blue');

    btnDb.addEventListener('click', () => {
      clearActive();
      btnDb.classList.add('btn-active', 'glow-blue');
      loadView('dbview.html', ['js/uifunctions.js', 'js/controls.js', 'js/main.js'], ['initializeUI', 'initializeControls']);
    });

    btnAlerts.addEventListener('click', () => {
      clearActive();
      btnAlerts.classList.add('btn-active', 'glow-blue');
      loadView('cardsview.html', ['js/card-controls.js', 'js/card-poll.js'], ['initializeCardControls', 'alertPoll.initialize']);
    });

    btnBacktester.addEventListener('click', () => {
      clearActive();
      btnBacktester.classList.add('btn-active', 'glow-blue');
      loadView('btview.html', ['js/uifunctions.js', 'js/controls.js', 'js/main.js'], ['initializeUI', 'initializeControls']);
  });
  });
</script>

</body>
</html>
